name: Build and Deploy to AWS S3

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci # Or yarn install if using Yarn

      - name: Build the app
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.MIKES_HACKER_NEWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.MIKES_HACKER_NEWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets-context.MIKES_HACKER_NEWS_REGION }}

      - name: Deploy to S3
        run: aws s3 sync ./dist s3://${{ secrets.MIKES_HACKER_NEWS_S3_BUCKET }} --delete # --delete removes old files

      - name: Invalidate CloudFront (optional)
        if: success()
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.MIKES_HACKER_NEWS_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
      # Optional: Invalidate CloudFront cache (add if using CloudFront)
